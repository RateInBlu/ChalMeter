<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chalmeter-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#15243A" />
      <stop offset="100%" stopColor="#0B1424" />
    </linearGradient>
    <linearGradient id="meter-arc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#D95D5D" />
      <stop offset="45%" stopColor="#E8A63A" />
      <stop offset="85%" stopColor="#A5ED45" />
      <stop offset="100%" stopColor="#36B879" />
    </linearGradient>
    <linearGradient id="road-grad" x1="50%" y1="100%" x2="50%" y2="20%">
      <stop offset="0%" stopColor="#1E314F" />
      <stop offset="100%" stopColor="#0B1424" />
    </linearGradient>
    <filter id="needle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" floodColor="#A5ED45" floodOpacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Navy Badge Background -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#chalmeter-bg)" stroke="#A5ED45" stroke-width="2.5" stroke-opacity="0.7" />

  <!-- Speedometer Dial Arc -->
  <path d="M 22 68 A 38 38 0 1 1 78 68" fill="none" stroke="url(#meter-arc)" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 2" />

  <!-- Stylised Indian Road Perspective -->
  <path d="M 32 78 L 44 42 Q 50 36 56 42 L 68 78 Z" fill="url(#road-grad)" stroke="#2A4368" stroke-width="1.5" />

  <!-- White Dashed Road Markings -->
  <path d="M 50 74 L 50 64 M 50 58 L 50 50 M 50 46 L 50 40" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />

  <!-- Directional Vehicle Marker -->
  <g transform="translate(50, 52) rotate(4)">
    <polygon points="-4,5 4,5 2,-5 -2,-5" fill="#FFFFFF" />
    <circle cx="0" cy="-6" r="1.5" fill="#A5ED45" />
  </g>

  <!-- Dial Center Pivot Hub -->
  <circle cx="50" cy="68" r="7" fill="#0B1424" stroke="#A5ED45" stroke-width="3" />

  <!-- Electric Lime Scoring Needle -->
  <g filter="url(#needle-glow)">
    <line x1="50" y1="68" x2="72" y2="34" stroke="#A5ED45" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="72" cy="34" r="2.5" fill="#FFFFFF" />
  </g>
</svg>
